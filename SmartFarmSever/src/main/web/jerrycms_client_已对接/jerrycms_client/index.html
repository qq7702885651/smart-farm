<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="all,follow">
    <!-- Bootstrap CSS-->
    <link rel="stylesheet" href="cmsManage/login/vendor/bootstrap/css/bootstrap.min.css">
    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="cmsManage/login/vendor/font-awesome/css/font-awesome.min.css">
    <!-- Fontastic Custom icon font-->
    <link rel="stylesheet" href="cmsManage/login/css/fontastic.css">
    <!-- Google fonts - Poppins -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,700">
    <!-- theme stylesheet-->
    <link rel="stylesheet" href="cmsManage/login/css/style.default.css" id="theme-stylesheet">
    <!-- Custom stylesheet - for your changes-->
    <link rel="stylesheet" href="cmsManage/login/css/custom.css">
	
	<link rel="stylesheet" href="cmsManage/assets/css/modal.css">
	<script src="cmsManage/assets/js/urlconfig.js"></script>
  </head>
  <body>
    <div class="page login-page">
      <div class="container d-flex align-items-center">
        <div class="form-holder has-shadow">
          <div class="row">
            <div class="col-lg-6">
              <div class="info d-flex align-items-center">
                <div class="content">
                  <div class="logo">
                    <h1>JerryCMS</h1>
                  </div>
                  <p>让数据管理变得更简单——YZ@工作室</p>
                </div>
              </div>
            </div>
            <!-- Form Panel    -->
            <div class="col-lg-6 bg-white">
              <div class="form d-flex align-items-center">
                <div class="content">
                  <div class="form-validate">
                    <div class="form-group">
                      <input id="login-username" type="text" name="username" required data-msg="请输入用户名" class="input-material">
                      <label for="login-username" class="label-material">用户名</label>
                    </div>
                    <div class="form-group">
                      <input id="login-password" type="password" name="loginPassword" required data-msg="请输入密码" class="input-material">
                      <label for="login-password" class="label-material">密码</label>
                    </div><a id="login" href="javascript:;" onclick="login()" class="btn btn-primary">登录</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="copyrights text-center">
        <p>Design by <a href="#" class="external">YZ@工作室</a></p>
      </div>
    </div>
	<!--提示框-->
	<div id="maskdiv" class="mask">
		<div id="tagdiv" class="tag">
			<div id="tagtitle">
				温馨提示
			</div>
			<div id="tagcont">
				
			</div>
			<div id="tagop">
				
			</div>
		</div>
	</div>
    <!-- JavaScript files-->
    <script src="cmsManage/login/vendor/jquery/jquery.min.js"></script>
    <script src="cmsManage/login/vendor/popper.js/umd/popper.min.js"> </script>
    <script src="cmsManage/login/vendor/bootstrap/js/bootstrap.min.js"></script>
    <script src="cmsManage/login/vendor/jquery.cookie/jquery.cookie.js"> </script>
    <script src="cmsManage/login/vendor/chart.js/Chart.min.js"></script>
    <script src="cmsManage/login/vendor/jquery-validation/jquery.validate.min.js"></script>
    <!-- Main File-->
    <script src="cmsManage/login/js/front.js"></script>
	<script src="cmsManage/assets/js/modal.js"></script>
	
	<script type="text/javascript">
		function login()
		{
			var username = $("#login-username").val();
			var passw = $("#login-password").val();
			if(""==username)
			{
				$("#tagcont").html("用户名不能为空");
				$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
				showModal();
				return;
			}
			if(""==passw){
				$("#tagcont").html("密码不能为空");
				$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
				showModal();
				return;
			}
			$.ajax({
			        url :  getRootPath()+"/api/user/login",
			        type : "post",
			        dataType : "json",
					xhrFields: {
						 withCredentials: true,
					 },
			        contentType: "application/json",
			        data: JSON.stringify({ // ✅ 必须 stringify
                        username: username,
                        passw: passw
                    }),
			        success : function(data) {
			           console.log(data);
					   if(data.status=="2")
					   {
						   $("#tagcont").html("用户名或密码为空");
						   $("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
						   showModal();
					   }else if(data.status=="0")
					   {
						   $("#tagcont").html(data.loginErrMsg);
						   $("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
						   showModal();
					   }else if(data.status=="1")
					   {
						   window.location.href = "cmsManage/channel_list.html";
					   }
			        }
			    });
		}
	</script>
  </body>
</html>
