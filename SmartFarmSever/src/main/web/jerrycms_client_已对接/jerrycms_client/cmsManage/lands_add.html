<script>
	 $("#navhead").load('./head.html');

	  var editor;
	   var callBackPath = getLoPath()+'/jerrycms_client/cmsManage/assets/KindEditor_4_1_6/redirect.html';
	         KindEditor.ready(function(K) {
			 editor =  K.create('#content', {
			 uploadJson : getRootPath()+'/manage/upload/uplaodIMG?callBackPath='+callBackPath,
			 allowFileManager : false,
			 afterBlur:function(){this.sync();},
			 afterUpload : function( url, data, name) {
				  editor.hideDialog();
			 }
			 });//end create
			 
			 K('#titleImage').click(function() {
				editor.loadPlugin('image', function() {
					editor.plugin.imageDialog({
						imageUrl : K('#titlePic').val(),
						showRemote : false,
						clickFn : function(url, title, width, height, border, align) {
							console.log(url);
							$("#titlePic").val(url); 
							
							//K('#titlePic').val(url);
							editor.hideDialog();
							$("#titleImage").attr('src',url); 
							document.getElementById("titleImage").src=url;
						}
					});//end imageDialog
				});//end loadPlugin
			});//end click
			
			
		});//end redady
</script>
<script>
	function loadData()
	{
		$.ajax({
			 url : getRootPath()+"/manage/channel/getList",
			 type : "post",
			 dataType : "json",
			 contentType: "application/x-www-form-urlencoded; charset=utf-8",
			 data: {},
			 success : function(data) {
				console.log(data);
				var channel_arr = data.allchannel;
				if(null!=channel_arr&&channel_arr.length>0)
				{
					var htmlstr = "";
					for(i=0;i<channel_arr.length;i++)
					{
						var item = channel_arr[i];
						htmlstr = htmlstr + "<option value='"+item.uid+"'>"+item.title+"</option>";
					}
					$("#channel_uid").html(htmlstr);
				}
			 }
		});
	}
</script>
<script>
	 //alert("hello");
		loadData();
</script>
<script>
