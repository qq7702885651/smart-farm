 <script>
	 function getParam() {
	 	var args = {};
	 	var query = location.search.substring(1);
	 	var pairs = query.split('&');
	 	console.log(pairs)
	 	for (var i = 0; i < pairs.length; i += 1) {
	 		var pos = pairs[i].indexOf('=');
	 		if (pos !== -1) {
	 			var argName = pairs[i].substring(0, pos);
	 			args[argName] = pairs[i].substring(pos + 1);
	 		}
	 	}
	 	return args;
	 }
 </script>
<script>

	  var editor;
	   var callBackPath = getLoPath()+'/jerrycms_client/cmsManage/assets/KindEditor_4_1_6/redirect.html';
	         KindEditor.ready(function(K) {
			 editor =  K.create('#content', {
			 uploadJson : getRootPath()+'/manage/upload/uplaodIMG?callBackPath='+callBackPath,
			 allowFileManager : false,
			 afterBlur:function(){this.sync();},
			 afterUpload : function( url, data, name) {
				
				
				 editor.hideDialog();
			 }
			 });//end create
			 
			 K('#titleImage').click(function() {
				editor.loadPlugin('image', function() {
					editor.plugin.imageDialog({
						imageUrl : K('#titlePic').val(),
						showRemote : false,
						clickFn : function(url, title, width, height, border, align) {
							console.log(url);
							$("#titlePic").val(url); 
							
							//K('#titlePic').val(url);
							editor.hideDialog();
							$("#titleImage").attr('src',url); 
							document.getElementById("titleImage").src=url;
						}
					});//end imageDialog
				});//end loadPlugin
			});//end click
			
			
		});//end redady
</script>
<script>
	function loadData(suid)
	{
		$.ajax({
			 url : getRootPath()+"/manage/sliders/getSliders",
			 type : "post",
			 dataType : "json",
			 contentType: "application/x-www-form-urlencoded; charset=utf-8",
			 data: {"uid":suid},
			 success : function(data) {
				console.log(data);
				var sliders = data.sliders;
				
				$("#uid").val(sliders.uid);
				$("#title").val(sliders.title);
				$("#pathurl").val(sliders.pathurl);
				$("#titleImage").attr('src',sliders.img); 
				$("#titlePic").val(sliders.img);
				$("#state").val(sliders.state);
				$("#remark").val(sliders.remark);
				
			 }
		});
	}
</script>
<script>
		var suid = getParam().uid;
		loadData(suid);
</script>
<script>
	$("#subbtn").click(function(){
		var uid = $("#uid").val();
		var title = $("#title").val();
		var pathurl = $("#pathurl").val();
		var img = $("#titlePic").val();
		var remark = $("#remark").val();
		var state = $("#state").val();
		if(""==title)
		{
			$("#tagcont").html("轮播图名称不能为空");
			$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
			showModal();
			return;
		}
		/* if(""==img)
		{
			$("#tagcont").html("请上传类目图标");
			$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
			showModal();
			return;
		} */
		$.ajax({
			 url : getRootPath()+"/manage/sliders/editSliders",
			 type : "post",
			 dataType : "json",
			 contentType: "application/x-www-form-urlencoded; charset=utf-8",
			 data: {"uid":uid,"title":title,"pathurl":pathurl,"img":img,"remark":remark,"state":state},
			 success : function(data) {
				console.log(data);
				if(data.status==0)
				{
					$("#tagcont").html("插入数据失败，请检查网络");
					$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
					showModal();
				}else if(data.status==1)
				{
					$("#tagcont").html("插入数据成功");
					$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
					showModal();
					window.location.href = "sliders_list.html";
				}
			 }
		});
	});
</script>
