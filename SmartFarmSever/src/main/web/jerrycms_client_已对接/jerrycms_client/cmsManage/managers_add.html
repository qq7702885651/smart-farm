<script>
	$("#subbtn").click(function(){
		var username = $("#username").val();
		var passw = $("#passw").val();
		var remark = $("#remark").val();
		if(""==username)
		{
			$("#tagcont").html("用户名不能为空");
			$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
			showModal();
			return;
		}
		if(""==passw)
		{
			$("#tagcont").html("密码不能为空");
			$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
			showModal();
			return;
		}
		/* if(""==img)
		{
			$("#tagcont").html("请上传类目图标");
			$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
			showModal();
			return;
		} */
		$.ajax({
			 url : getRootPath()+"/manage/managers/addManagers",
			 type : "post",
			 dataType : "json",
			 contentType: "application/x-www-form-urlencoded; charset=utf-8",
			 data: {"username":username,"passw":passw,"remark":remark},
			 success : function(data) {
				console.log(data);
				if(data.status==0)
				{
					$("#tagcont").html("插入数据失败，请检查网络");
					$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
					showModal();
				}else if(data.status==1)
				{
					$("#tagcont").html("插入数据成功");
					$("#tagop").html("<a id='surebtn' href='javascript:;' onclick='hideModal()'>确定</a>");
					showModal();
					window.location.href = "managers_list.html";
				}
			 }
		});
	});
</script>
